<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel de Anfitrión - Cima Blanca</title>
    <style>
        * { box-sizing: border-box; max-width: 100%; }
        html, body { overflow-x: hidden; width: 100%; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .panel-container { display: none; background: #1e293b; border: 2px solid #d4af37; border-radius: 20px; padding: 25px; width: 100%; max-width: 440px; min-width: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { color: #fcd34d; font-size: 18px; margin-top: 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 13px; color: #94a3b8; line-height: 1.4; text-align: center; margin-bottom: 20px; }
        label { font-size: 11px; color: #38bdf8; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 6px; }
        input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; padding: 10px; font-size: 13px; box-sizing: border-box; margin-bottom: 15px; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        textarea { width: 100%; height: 130px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; padding: 10px; font-size: 12px; box-sizing: border-box; resize: vertical; font-family: monospace; margin-bottom: 15px; overflow-wrap: break-word; word-break: break-word; }
        textarea:focus { outline: none; border-color: #d4af37; }
        .btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; border: none; font-weight: bold; padding: 14px; border-radius: 10px; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn:active { filter: brightness(0.9); }
        .result-box { display: none; background: #0f172a; border: 1px dashed #38bdf8; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .result-title { font-size: 11px; color: #38bdf8; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .result-link { font-size: 12px; color: #f8fafc; font-family: monospace; word-break: break-all; margin-bottom: 12px; background: #1e293b; padding: 8px; border-radius: 6px; }
        .btn-copy { background: #10B981; color: white; margin-top: 5px; }
    </style>
</head>
<body>

<div class="panel-container">
    <h2>🛠️ Panel de Anfitrión</h2>
    <p>Pega el correo de Sifely y pon el nombre. El sistema arma un enlace limpio y listo para enviar:</p>
    
    <label for="nombre-input">Nombre del Huésped:</label>
    <input type="text" id="nombre-input" placeholder="Ej. Juan Pérez">

    <label for="reserva-input">Código de Reserva (déjalo vacío y se genera solo):</label>
    <input type="text" id="reserva-input" placeholder="Se autogenera, ej. SEP14-YAZ">

    <label for="sifely-input">Texto copiado de Sifely:</label>
    <textarea id="sifely-input" placeholder="Pega el mensaje completo de Sifely aquí..."></textarea>
    
    <button class="btn" onclick="generarEnlace()">Generar Enlace Corto y Limpio</button>
    
    <div id="warning-box" style="display:none; background:#78350f; border:1px solid #f59e0b; color:#fcd34d; padding:10px; border-radius:8px; font-size:12px; margin-top:10px;"></div>

    <div id="result-box" class="result-box">
        <div class="result-title">Enlace listo para enviar:</div>
        <div id="result-link" class="result-link"></div>
        <button class="btn btn-copy" onclick="copiarEnlace()">📋 Copiar Enlace</button>
        <a id="whatsapp-share-btn" href="#" target="_blank" rel="noopener" class="btn btn-copy" style="background:#25D366; margin-top:8px; text-decoration:none; display:block; text-align:center; box-sizing:border-box;">📲 Enviar por WhatsApp</a>
    </div>
</div>

<script>
    // Cortina de acceso básica: NO es seguridad real (la clave queda visible en el
    // código fuente para quien sepa inspeccionarlo). Solo evita que alguien abra este
    // panel por accidente (ej. reabriendo el historial del navegador o un enlace
    // reenviado sin querer). Gvelarde: reemplaza el texto de abajo por tu propia clave
    // antes de subir este archivo, y no la compartas con nadie más que tú.
    (function verificarAcceso() {
        const CLAVE_PANEL = "Dosogu";
        const intento = prompt("🔒 Clave de acceso del panel:");
        if (intento !== CLAVE_PANEL) {
            document.body.innerHTML = '<p style="color:#94a3b8; text-align:center; font-family:sans-serif; padding:60px 20px;">Acceso no autorizado.</p>';
            return;
        }
        document.querySelector('.panel-container').style.display = 'block';
    })();

    function generarCodigoReserva(nombre, fechaInicio) {
        // Ej: "Sep 14, 3:00 PM" -> "SEP14"
        const matchFecha = (fechaInicio || '').match(/^([A-Za-z]{3})[A-Za-z]*\s*(\d{1,2})/);
        const fechaCorta = matchFecha ? (matchFecha[1] + matchFecha[2]).toUpperCase() : 'SINFECHA';
        // 3 primeras letras del nombre (sin espacios ni tildes/ñ, para que el código quede simple)
        const soloLetras = (nombre || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z]/g, '');
        const inicialesNombre = soloLetras.substring(0, 3).toUpperCase() || 'INV';
        return `${fechaCorta}-${inicialesNombre}`;
    }

    function generarEnlace() {
        const nombre = document.getElementById('nombre-input').value.trim();
        const texto = document.getElementById('sifely-input').value;
        
        // Esperado: texto de Sifely en inglés que contiene "PIN: XXXXXX".
        // Si Sifely cambia el idioma o la plantilla del mensaje, actualizar este regex.
        const matchPin = texto.match(/PIN\*?[:\s]+\*?([0-9]{4,6})\*?/i);
        if (!matchPin || !matchPin[1]) {
            alert("⚠️ No se pudo detectar el PIN automáticamente. Verifica que hayas copiado el texto completo de Sifely.");
            return;
        }
        const pin = matchPin[1];

        // Esperado: texto de Sifely en inglés con el formato "Start time: <fecha>" y "End time: <fecha>".
        // Si Sifely cambia el idioma o la plantilla del mensaje, actualizar este regex.
        const matchStart = texto.match(/Start time:\s*([^\n]+)/i);
        let startVal = matchStart ? matchStart[1].trim() : "";
        // Ya no se le quitan los espacios: encodeURIComponent los codifica correctamente
        // y así la fecha se ve legible en la guía del huésped (ej. "Sep 14, 3:00 PM").

        const matchEnd = texto.match(/End time:\s*([^\n]+)/i);
        let endVal = matchEnd ? matchEnd[1].trim() : "";

        // Validación de advertencia si no detecta las fechas
        const advertencias = [];
        if (!startVal) advertencias.push('fecha de check-in');
        if (!endVal) advertencias.push('fecha de check-out');
        const warningBox = document.getElementById('warning-box');
        if (advertencias.length > 0) {
            warningBox.textContent = '⚠️ No se detectó: ' + advertencias.join(' y ') + '. Revisa el enlace antes de enviarlo.';
            warningBox.style.display = 'block';
        } else {
            warningBox.style.display = 'none';
        }
        
        // Usa la carpeta donde vive este panel, sin depender de cómo se llame su propio archivo.
        // Asume que la guía principal se sirve como documento por defecto de esa carpeta (index.html).
        const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        
        let reserva = document.getElementById('reserva-input').value.trim();
        if (!reserva) {
            reserva = generarCodigoReserva(nombre, startVal);
            document.getElementById('reserva-input').value = reserva; // así lo ves y puedes ajustarlo si quieres
        }

        // Arma el enlace corto
        let enlaceFinal = `${baseUrl}?pin=${pin}`;
        if (nombre) enlaceFinal += `&nombre=${encodeURIComponent(nombre)}`;
        if (startVal) enlaceFinal += `&inicio=${encodeURIComponent(startVal)}`;
        if (endVal) enlaceFinal += `&fin=${encodeURIComponent(endVal)}`;
        // Código neutral para medir en Analytics SIN mandar el nombre real del huésped (ver nota de PII).
        if (reserva) enlaceFinal += `&reserva=${encodeURIComponent(reserva)}`;
        
        document.getElementById('result-link').textContent = enlaceFinal;
        document.getElementById('result-box').style.display = 'block';

        // Configura el botón de envío directo a WhatsApp
        document.getElementById('whatsapp-share-btn').href = `https://wa.me/?text=${encodeURIComponent('Hola! Aquí tienes tu guía digital de bienvenida: ' + enlaceFinal)}`;
    }

    function copiarEnlace() {
        const linkText = document.getElementById('result-link').textContent;
        navigator.clipboard.writeText(linkText).then(() => {
            alert("¡Enlace copiado al portapapeles!");
        });
    }
</script>

</body>
</html>
